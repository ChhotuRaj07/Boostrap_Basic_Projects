<body>
     <div class="d-flex justify-content-center align-content-center mt-5 gap-3">

    <br>
    <br>
    <br>
   <div class="d-flex justify-content-center align-content-center gap-3">

    <input type="number" class="marks" placeholder="Subject English Marks" required>
    <input type="number" class="marks" placeholder="Subject Chemistry Marks" required>
    <input type="number" class="marks" placeholder="Subject Physics Marks" required>
   </div>
   <div class="d-flex align-content-center justify-content-center gap-5 mt-5 p-5">
    <button class="px-4 rounded-1 p-1" type="submit">Submit</button>
    <button class="px-4 rounded-1 p-1" type="reset">Reset</button>
   </div>
