<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="d-flex justify-content-center mt-5">
    <h2>Gujarat University</h2>
  </div>

  <!-- FORM START -->
  <form id="resultForm" class="mt-4">
    <div class="d-flex justify-content-center gap-3 mb-3">
      <label class="form-label">Name:</label>
      <input type="text" id="name" class="form-control" placeholder="Enter Your Name" required>
    </div>

    <div class="d-flex justify-content-center gap-3 mb-3">
      <label class="form-label">Roll No:</label>
      <input type="number" id="roll" class="form-control" placeholder="Enter Your Roll No" required>
    </div>

    <div class="d-flex justify-content-center gap-3 mb-3">
      <label class="form-label">Semester:</label>
      <input type="text" id="semester" class="form-control" placeholder="Enter Your Semester" required>
    </div>

    <div class="d-flex flex-column align-items-center gap-2">
      <h6>Enter Subject Marks</h6>
      <input type="number" class="marks form-control w-50" placeholder="Hindi Marks" required>
      <input type="number" class="marks form-control w-50" placeholder="Maths Marks" required>
      <input type="number" class="marks form-control w-50" placeholder="English Marks" required>
      <input type="number" class="marks form-control w-50" placeholder="Chemistry Marks" required>
      <input type="number" class="marks form-control w-50" placeholder="Physics Marks" required>
    </div>

    <div class="d-flex justify-content-center gap-5 mt-4">
      <button class="btn btn-primary" type="submit">Submit</button>
      <button class="btn btn-secondary" type="reset">Reset</button>
    </div>
  </form>
  <!-- FORM END -->

  <!-- Result Section -->
  <div id="result" class="container mt-4"></div>

  <script>
    document.getElementById('resultForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const roll = document.getElementById('roll').value;
      const semester = document.getElementById('semester').value;
      const marksInputs = document.querySelectorAll('.marks');

      let marks = [];
      marksInputs.forEach(input => marks.push(Number(input.value)));

      const totalMarks = 500; // 5 subjects * 100
      const obtained = marks.reduce((a,b) => a+b, 0);
      const percentage = (obtained / totalMarks) * 100;

      // Grade logic
      let grade = '';
      if (percentage > 90) grade = 'A+ Grade';
      else if (percentage >= 70) grade = 'A Grade';
      else if (percentage >= 50) grade = 'B Grade';
      else if (percentage >= 35) grade = 'C Grade';
      else grade = 'Fail';

      // Subject rows
      let subjectsHTML = '';
      marks.forEach((m, i) => {
        subjectsHTML += `<tr><td>Subject ${i+1}</td><td>${m}</td></tr>`;
      });

      document.getElementById('result').innerHTML = `
        <div class="card">
          <div class="card-body">
            <h3 class="card-title text-center mb-3">Result</h3>
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Roll No:</strong> ${roll}</p>
            <p><strong>Semester:</strong> ${semester}</p>

            <table class="table table-bordered mt-3">
              <thead>
                <tr><th>Subject</th><th>Marks</th></tr>
              </thead>
              <tbody>
                ${subjectsHTML}
                <tr><th>Total Marks</th><th>${totalMarks}</th></tr>
                <tr><th>Obtained Marks</th><th>${obtained}</th></tr>
                <tr><th>Percentage</th><th>${percentage.toFixed(2)}%</th></tr>
              </tbody>
            </table>
            <div class="text-center fs-5 fw-bold">${grade}</div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
